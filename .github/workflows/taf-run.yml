name: Reusable TAF run and publish

on:
  workflow_call:
    inputs:
      r-version:
        description: "R version to use"
        required: false
        default: "release"
        type: string

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        default: 10
        type: number

permissions:
  contents: write

jobs:
  taf:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # honor --no-taf unless manually dispatched
    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '--no-taf')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          extra-repositories: |
            https://cloud.r-project.org
            https://ices-tools-prod.r-universe.dev
            https://packagemanager.posit.co/cran/__linux__/jammy/latest

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::TAF

      - name: Clean any data mistakenly pushed to repo
        run: |
          Rscript -e 'TAF::clean.boot(force = TRUE)'
          Rscript -e 'TAF::clean()'

      - name: Compute hash of boot inputs
        shell: bash
        run: |
          set -e

          MSG="${{ github.event.head_commit.message || '' }}"
          echo "MSG=$MSG" >> "$GITHUB_ENV"

          BOOT_HASH=$(
            {
              find boot -maxdepth 1 -type f -name "DATA.bib" -print0
              find boot -maxdepth 1 -type f -name "*.R" -print0
              find boot/initial/data -type f -print0
            } |
            sort -z |
            xargs -0 sha256sum |
            sha256sum | awk '{print $1}'
          )

          echo "BOOT_HASH=$BOOT_HASH" >> "$GITHUB_ENV"

          git fetch origin taf || true

          # jq availability is assumed
          # command -v jq >/dev/null || sudo apt-get install -y jq
          if git show-ref --quiet refs/remotes/origin/taf; then
            PREV_BOOT_HASH=$(git show origin/taf:taf-metadata.json | jq -r '.boot_hash // empty')
          else
            PREV_BOOT_HASH=""
          fi

          if [ -n "$PREV_BOOT_HASH" ] && [ "$BOOT_HASH" = "$PREV_BOOT_HASH" ]; then
            RUN_BOOT=false
          else
            RUN_BOOT=true
          fi

          if echo "$MSG" | grep -q -- "--force-boot"; then
            RUN_BOOT=true
          fi

          echo "RUN_BOOT=$RUN_BOOT" >> "$GITHUB_ENV"

      - name: Run TAF boot (conditional)
        shell: bash
        run: |
          if [ "$RUN_BOOT" = "false" ]; then
            if git ls-tree -r origin/taf --name-only | grep -q '^boot/data/'; then
              rm -rf boot/data
              git checkout origin/taf -- boot/data
              BOOT_REUSE_COMMENT="boot inputs unchanged; reused boot/data from previous taf"
            else
              Rscript -e 'TAF::taf.boot()'
              BOOT_REUSE_COMMENT="boot unchanged but boot/data missing; rebuilt"
            fi
          else
            Rscript -e 'TAF::taf.boot()'
            BOOT_REUSE_COMMENT="boot inputs changed or --force-boot specified"
          fi

          echo "BOOT_REUSE_COMMENT=$BOOT_REUSE_COMMENT" >> "$GITHUB_ENV"
          echo "::notice::BOOT reuse: $BOOT_REUSE_COMMENT"

      - name: Run TAF source
        run: |
          Rscript -e 'TAF::source.all()'

      - name: Determine tagging and squash intent
        shell: bash
        run: |
          TAG_TYPE=""
          SQUASH_MODE="since_last_tag"

          if echo "$MSG" | grep -q -- "--tag-final"; then
            TAG_TYPE="final"
          elif echo "$MSG" | grep -q -- "--tag-advice"; then
            TAG_TYPE="advice"
          fi

          if echo "$MSG" | grep -q -- "--no-squash"; then
            SQUASH_MODE="none"
          fi

          echo "TAG_TYPE=$TAG_TYPE" >> "$GITHUB_ENV"
          echo "SQUASH_MODE=$SQUASH_MODE" >> "$GITHUB_ENV"

      - name: Add metadata
        shell: bash
        run: |
          set -e
          mkdir -p output

          TAF_VERSION=$(Rscript -e 'cat(as.character(packageVersion("TAF")))')
          R_VERSION=$(Rscript -e 'cat(as.character(getRversion()))')

          git fetch origin taf --tags || true
          LAST_TAG=$(git describe --tags --abbrev=0 origin/taf 2>/dev/null || true)

          cat > output/taf-metadata.json <<EOF
          {
            "schema_version": "1.0",
            "timestamp_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "repository": "${{ github.repository }}",
            "source_ref": "${{ github.ref }}",
            "source_sha": "${{ github.sha }}",
            "runner": "${{ runner.os }}",
            "r_version": "$R_VERSION",
            "taf_version": "$TAF_VERSION",
            "commit_message": "$MSG",
            "boot_hash": "$BOOT_HASH",
            "boot_reused": $([ "$RUN_BOOT" = "false" ] && echo true || echo false),
            "boot_reuse_comment": "$BOOT_REUSE_COMMENT",
            "squash_mode": "$SQUASH_MODE",
            "last_tag": "${LAST_TAG:-null}",
            "tag_applied": "${TAG_TYPE:-none}"
          }
          EOF

      - name: Commit results to taf branch (squash-aware)
        shell: bash
        run: |
          set -e

          git config user.email "github@ices.dk"
          git config user.name "ices-github-bot"

          git fetch origin taf --tags || true
          git checkout --orphan taf-tmp

          [ -d ".github" ] && git rm -rf .github

          git add -A
          for dir in boot/data data model report output; do
            [ -d "$dir" ] && git add -f "$dir"
          done

          git diff --cached --quiet && exit 0

          TREE=$(git write-tree)

          if [ "$SQUASH_MODE" = "since_last_tag" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 origin/taf 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              PARENT=$(git rev-list -n 1 "$LAST_TAG")
            else
              PARENT=""
            fi
          else
            PARENT=$(git rev-parse origin/taf 2>/dev/null || true)
          fi


          LABEL="TAF results"

          [ "$TAG_TYPE" = "advice" ] && LABEL="TAF advice results"
          [ "$TAG_TYPE" = "final"  ] && LABEL="TAF final results"

          COMMIT_MSG="$LABEL — $(date -u '+%Y-%m-%d %H:%M UTC')"


          if [ -n "$PARENT" ]; then
            COMMIT=$(echo "$COMMIT_MSG" | git commit-tree "$TREE" -p "$PARENT")
          else
            COMMIT=$(echo "$COMMIT_MSG" | git commit-tree "$TREE")
          fi

          git update-ref refs/heads/taf "$COMMIT"

          if [ "$TAG_TYPE" = "final" ]; then
            git tag "final-$(date -u +%Y)" "$COMMIT"
          elif [ "$TAG_TYPE" = "advice" ]; then
            git tag "advice-$(date -u +%Y)" "$COMMIT"
          fi

          git push origin refs/heads/taf:taf --force --tags
