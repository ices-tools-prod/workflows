name: Reusable TAF run and publish

on:
  workflow_call:
    inputs:
      r-version:
        description: "R version to use"
        required: false
        default: "release"
        type: string

      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        default: 10
        type: number

permissions:
  contents: write   # needed to push branch + tags

jobs:
  taf:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # honor --no-taf unless manually dispatched
    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '--no-taf')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          extra-repositories: |
            https://cloud.r-project.org
            https://ices-tools-prod.r-universe.dev
            https://packagemanager.posit.co/cran/__linux__/jammy/latest

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::TAF

      - name: Clean any data mistakenly pushed to repo
        run: |
          Rscript -e 'TAF::clean.boot(force = TRUE)'
          Rscript -e 'TAF::clean()'

      - name: compute hash of boot files
        shell: bash
        run: |
          # exit on any error
          set -e

          MSG="${{ github.event.head_commit.message || '' }}"
          echo "MSG=$MSG" >> "$GITHUB_ENV"

          BOOT_HASH=$(
            {
              find boot -maxdepth 1 -type f -name "DATA.bib" -print0
              find boot -maxdepth 1 -type f -name "*.R" -print0
              find boot/initial/data -type f -print0
            } \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | awk '{print $1}'
          )

          echo "BOOT_HASH=$BOOT_HASH" >> "$GITHUB_ENV"

          # get previous boot hash
          git fetch origin taf || true

          # jq availability is assumed
          if git show-ref --quiet refs/remotes/origin/taf; then
            PREV_BOOT_HASH=$(git show origin/taf:taf-metadata.json | jq -r '.boot_hash // empty')
          else
            PREV_BOOT_HASH=""
          fi

          if [ -n "$PREV_BOOT_HASH" ] && [ "$BOOT_HASH" = "$PREV_BOOT_HASH" ]; then
            echo "Boot inputs unchanged → reusing previous boot/data"
            RUN_BOOT=false
          else
            echo "Boot inputs changed → running taf.boot()"
            RUN_BOOT=true
          fi


          if echo "$MSG" | grep -q -- "--force-boot"; then
            RUN_BOOT=true
          fi

          echo "RUN_BOOT=$RUN_BOOT" >> "$GITHUB_ENV"

      - name: Run TAF boot
        shell: bash
        run: |
          if [ "$RUN_BOOT" = "false" ]; then
            echo "Checking out boot/data from previous taf commit"
            git checkout origin/taf -- boot/data
          else
            Rscript -e 'TAF::taf.boot()'
          fi

      - name: Run TAF source
        run: |
          Rscript -e 'TAF::source.all()'

      - name: Add metadata
        shell: bash
        run: |
          # exit on any error
          set -e

          # ---- determine tag early ----
          TAG="run-$(date -u +%Y%m%d-%H%M)"

          if echo "$MSG" | grep -q -- "--tag-final"; then
            TAG="final-$(date -u +%Y)"
          elif echo "$MSG" | grep -q -- "--tag-advice"; then
            TAG="advice-$(date -u +%Y)"
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # ---- versions ----
          TAF_VERSION=$(Rscript -e 'cat(as.character(packageVersion("TAF")))')
          R_VERSION=$(Rscript -e 'cat(as.character(getRversion()))')

          # ---- parent taf SHA (if any) ----
          if git show-ref --quiet refs/remotes/origin/taf; then
            TAF_BRANCH_PARENT="\"$(git rev-parse origin/taf)\""
          else
            TAF_BRANCH_PARENT=null
          fi

          # ---- write metadata ----
          cat > taf-metadata.json <<EOF
          {
            "schema_version": "1.0",
            "taf_run_id": "$TAG",
            "timestamp_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "repository": "${{ github.repository }}",
            "source_ref": "${{ github.ref }}",
            "source_sha": "${{ github.sha }}",
            "taf_branch_parent": $TAF_BRANCH_PARENT,
            "runner": "${{ runner.os }}",
            "r_version": "$R_VERSION",
            "taf_version": "$TAF_VERSION",
            "trigger": "${{ github.event_name }}",
            "commit_message": "$MSG",
            "boot_hash": "$BOOT_HASH",
            "boot_reused": $([ "$RUN_BOOT" = "false" ] && echo "true" || echo "false")
          }
          EOF


      - name: Commit results to taf branch (clean tree, preserved history)
        shell: bash
        run: |
          # exit on any error
          set -e

          git config user.email "github@ices.dk"
          git config user.name "ices-github-bot"

          # Fetch remote taf if it exists (don't fail if not, we'll create it, hence || true)
          git fetch origin taf || true

          # Start orphaned local worktree
          git checkout --orphan taf-tmp

          # Remove CI files from results branch
          if [ -d ".github" ]; then
            git rm -rf .github
          fi

          # Stage everything that exists
          git add -A

          # Force-add TAF result folders if present
          for dir in data model report output; do
            if [ -d "$dir" ]; then
              git add -f "$dir"
            fi
          done

          # Abort if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Create commit tree
          TREE=$(git write-tree)

          if git show-ref --quiet refs/remotes/origin/taf; then
            PARENT=$(git rev-parse origin/taf)
            COMMIT=$(echo "Run TAF and publish results" | \
              git commit-tree "$TREE" -p "$PARENT")
          else
            COMMIT=$(echo "Run TAF and publish results" | \
              git commit-tree "$TREE")
          fi

          git update-ref refs/heads/taf "$COMMIT"

          git tag "$TAG" "$COMMIT"

          # Push branch + tags
          git push origin refs/heads/taf:taf --tags --force
